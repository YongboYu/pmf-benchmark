default_language_version:
  python: python3.11

# Legacy top-level code (models/, preprocessing/, utils/, train.py) predates the
# src/ package layout and is not yet linted to the current ruff standard. Scope
# pre-commit to the maintained package + data artefacts are excluded from all hooks.
exclude: |
  (?x)^(
    models/|
    preprocessing/|
    utils/|
    train\.py|
    scripts/preprocess_logs\.py|
    archive/|
    data/|
    data_archive/|
    results/|
    results_archive/|
    notebooks/|
    dfgs/|
    entroclus/|
    ER/|
    ER_v2/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
