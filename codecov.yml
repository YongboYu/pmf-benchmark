# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
# Coverage is informational only (never fails CI) while the suite is young.

comment: false

github_checks:
  annotations: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
        informational: true
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

ignore:
  - "tests/**/*"
  - "archive/**/*"
  - "notebooks/**/*"
  - "**/__pycache__/**"
